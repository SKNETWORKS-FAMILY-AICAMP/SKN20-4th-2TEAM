services:
  # 1. Nginx: 외부 요청을 받는 대문
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      # [수정] static 파일은 이제 Django 컨테이너와 공유 볼륨을 통해 전달받습니다.
      - static_volume:/app/static
    depends_on:
      - web-backend

  # 2. Django: 백엔드 서비스
  web-backend:
    image: 77eileen/backend:latest
    container_name: django-app
    env_file:
      - .env
    environment:
      - DEBUG=False
      - RAG_API_URL=http://rag-engine:8001
    volumes:
      # [수정] 이미지 빌드 시 생성된 static 파일을 Nginx와 공유하기 위해 볼륨 사용
      - static_volume:/app/staticfiles

  # 3. FastAPI: RAG 엔진
  rag-engine:
    image: 77eileen/rag-engine:latest
    container_name: rag-engine
    env_file:
      - .env
    # [수정] 이제 이미지에 데이터와 코드가 모두 포함되어 있으므로 volumes 마운트가 필요 없습니다.
    volumes:
      # [추가] 생성된 벡터 DB를 영속적으로 저장하기 위한 볼륨
      - rag_db_data:/app/data/vector_db
    working_dir: /app
    environment:
      - PYTHONPATH=/app:/app/src
      - VECTOR_DB_PATH=/app/data/vector_db/chroma
    command: ["uvicorn", "src.rag.api:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]

# [추가] Nginx와 Django가 static 파일을 공유하기 위한 볼륨
volumes:
  static_volume:
  rag_db_data: