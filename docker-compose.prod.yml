services:
  # 1. Nginx: 외부 요청을 가장 먼저 받는 대문
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./backend/staticfiles:/app/static  # Django에서 모은 정적 파일 서빙
    depends_on:
      - web-backend

  # 2. Django: 실제 웹 백엔드
  web-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod # 배포용 도커파일 사용
    container_name: django-app
    env_file:
      - .env
    environment:
      - DEBUG=False
      - RAG_API_URL=http://rag-engine:8001
    volumes:
      - ./backend/staticfiles:/app/staticfiles # 정적 파일을 Nginx와 공유하기 위한 볼륨
    # 주석: 배포 시에는 소스 코드 자체를 볼륨으로 연결하지 않고, 빌드된 이미지 내 코드를 사용합니다.

  # 3. FastAPI: RAG 엔진
  rag-engine:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: rag-engine
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # 1. 배포용이지만 경로 문제를 확실히 잡기 위해 소스도 연결해줍니다.
      - ./src:/app/src 
    # 2. 파이썬이 파일을 찾는 기준점 고정
    working_dir: /app
    environment:
      - PYTHONPATH=/app:/app/src
    # 3. 개발용과 동일하게 실행
    command: ["uvicorn", "src.rag.api:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]